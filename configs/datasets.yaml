schema_version: 1

forest_vehicles:
  provider: roboflow
  project: drone-forest-vehicles
  workspace: drones-88u87
  version: 1  # Fixed export for reproducible evaluation; environment overrides are supported.
  workspace_env: ROBOFLOW_WORKSPACE
  version_env: ROBOFLOW_VERSION
  api_key_env: ROBOFLOW_API_KEY
  export_format: yolov8
  directory: data/forest_vehicles
  role: final_evaluation
  download_by_default: false

visdrone:
  provider: ultralytics
  dataset_config: VisDrone.yaml
  directory: data/visdrone
  role: exploratory_analysis
  download_by_default: false
  optional_flag: --include-visdrone
  # The model checkpoint supplies its own class IDs independently.
  labels:
    - pedestrian
    - people
    - bicycle
    - car
    - van
    - truck
    - tricycle
    - awning-tricycle
    - bus
    - motor
