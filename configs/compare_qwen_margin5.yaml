# Four annotated classes, 82 references, margin 5 px, no rejection.
schema_version: 1
device: cuda
classes_file: configs/classes_comparison.yaml
datasets_file: configs/datasets.yaml
detector:
  provider: ultralytics
  weights: artifacts/weights/vehicle_detection_yolo26s_MVRSD_VIS.pt
  vehicle_classes:
  - vehicle
  confidence_threshold: 0.4
  iou_threshold: 0.5
  image_size: 1280
  crop_margin_pixels: 5
  source: local
recognition:
  backbone: qwen3_vl_embedding_2b
  weights: Qwen/Qwen3-VL-Embedding-2B
  pretrained_on: qwen3_vl_multimodal_embedding
  preprocessing: qwen_native
  feature_dimension: 2048
  projection_head: false
  normalization: l2
  similarity: cosine
  class_score: maximum_reference_similarity
  top_k: 3
  batch_size: 1
  cpu_threads: 4
  acceptance_threshold: -1.0
  unknown_label: unknown
references:
  directory: outputs/recognition_comparison_margin5/gallery_82
  index_directory: artifacts/reference_indexes/comparison_margin5_82/qwen
inference:
  rotations_degrees:
  - 0
  duplicate_iou_threshold: 0.5
  output_directory: outputs
  save_annotated_images: true
