[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aerial-vehicle-recognition"
version = "0.1.0"
description = "Offline aerial vehicle recognition using pretrained detection and visual similarity."
readme = "README.md"
requires-python = ">=3.10,<3.13"
dynamic = ["dependencies"]

[project.scripts]
aerial-vehicles = "vehicle_recognition.cli:main"

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.setuptools.packages.find]
where = ["src"]
