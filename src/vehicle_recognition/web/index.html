<style>
:root{color-scheme:dark;font-family:Inter,system-ui,sans-serif;background:#100f13;color:#f4f1f8;--panel:#17151c;--line:#332b40;--muted:#b5a9c2;--purple:#c5a1ff;--solid:#49267b}
*{box-sizing:border-box}body{margin:0}button{font:inherit;cursor:pointer}button:focus-visible{outline:2px solid var(--purple);outline-offset:3px}[hidden]{display:none!important}
header{background:#0d0b10;border-bottom:1px solid var(--line)}.bar{min-height:56px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:0 25px}.brand{grid-column:2}.brand img{display:block;width:108px;height:auto}.demo{justify-self:end;color:var(--muted);border:1px solid var(--line);border-radius:5px;padding:5px 8px;font-size:11px}
main{width:100%;max-width:1380px;margin:auto;padding:26px 30px 40px}h1{margin:0;font-size:clamp(26px,4vw,38px);letter-spacing:-.04em;line-height:1.12}.intro{margin:9px 0 18px;color:var(--muted);font-size:14px}
.actions{display:grid;grid-template-columns:1fr;gap:10px;margin-bottom:18px}.primary,.secondary{display:flex;align-items:center;justify-content:center;gap:12px;padding:9px 14px;border-radius:7px;font-size:13px;text-align:left}.primary{background:#231831;border:1px dashed #735395;color:#eee1fc;min-height:70px}.primary:hover,.primary.drop{background:#37214d;border-color:var(--purple)}.primary strong,.primary small,.secondary strong,.secondary small{display:block}.primary small,.secondary small{margin-top:3px;color:var(--muted);font-size:11px}.upload-icon{font-size:21px;color:var(--purple)}.secondary{background:var(--panel);border:1px solid var(--line);color:inherit}.secondary:hover{border-color:var(--purple)}.secondary img{width:56px;height:42px;object-fit:cover;border-radius:4px}
.workspace{display:grid;grid-template-columns:minmax(0,2.1fr) minmax(275px,1fr);gap:12px;align-items:start}.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;overflow:hidden}.head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line)}.head h2,h3{margin:0;font-size:14px}.count{font-size:11px;color:var(--muted)}.canvas{position:relative;background:#0d0b10}.canvas img{display:block;width:100%;height:auto}.box{position:absolute;border:2px solid #e6ccff;background:#8b53d826;border-radius:2px;padding:0;color:#180929}.box span{position:absolute;left:-2px;top:-22px;background:#e6ccff;padding:2px 6px;border-radius:3px 3px 0 0;font-weight:750;font-size:11px;white-space:nowrap}.box[aria-pressed=true]{border-color:#d38fff;box-shadow:0 0 0 2px #210b3399;background:#b477f83b}.box[aria-pressed=true] span{background:#d38fff}.box.unknown{border-color:#ffd587}.box.unknown span{background:#ffd587}.box.unknown[aria-pressed=true]{border-color:#ffb955}.box.unknown[aria-pressed=true] span{background:#ffb955}.caption{margin:0;padding:10px 14px;color:var(--muted);font-size:11px;overflow-wrap:anywhere}
.detail{padding:12px 14px 14px}.crop{width:100%;height:auto;aspect-ratio:560/264;border-radius:5px;display:block;background:#100d15}.result{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:12px}h3{font-size:18px;letter-spacing:-.025em}.tag{font-size:10px;padding:4px 6px;border-radius:4px;background:#322148;color:#e0c2ff;white-space:nowrap}.tag.warn{background:#3a2917;color:#ffd587}.metrics{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:10px 0 14px}.metric{background:#20192b;padding:8px;border-radius:4px;color:var(--muted);font-size:10px}.metric strong{display:block;font-size:16px;color:#f2e7ff;margin-top:3px}
.rank-title{font-size:12px;margin:0 0 6px}.rank{list-style:none;padding:0;margin:0}.rank li{display:grid;grid-template-columns:17px minmax(0,1fr) auto;align-items:center;gap:5px;padding:7px 0;border-top:1px solid var(--line);font-size:12px}.rank b{font-variant-numeric:tabular-nums;color:var(--purple)}.rank-index{color:var(--muted)}.rank-note{font-size:11px;color:var(--muted);margin:6px 0 0}.empty,.error{color:var(--muted);font-size:13px}.error{color:#ffaba5}.card.drop{outline:2px solid var(--purple);outline-offset:2px}
@media(max-width:1000px){main{padding-inline:18px}}
@media(max-width:800px){.workspace{grid-template-columns:1fr}}
@media(max-width:460px){.actions{grid-template-columns:1fr}.primary,.secondary{justify-content:flex-start}.bar{padding-inline:14px}}
</style>

<main id="analise">
<h1>Análise de imagem aérea</h1>
<p class="intro">Envie uma imagem aérea para reconhecer veículos.</p>
<div class="actions">
<button class="primary" id="upload"><span class="upload-icon" aria-hidden="true">↑</span><span><strong>Carregar imagem</strong><small>Arraste uma imagem ou clique para escolher</small></span></button>
<input type="file" id="file" accept="image/*" hidden>
</div>
<p class="error" id="error" role="alert" hidden></p>
<div class="workspace">
<section class="card" id="image-card" aria-label="Imagem aérea">
<div class="head"><h2>Imagem aérea</h2><span class="count" id="count"></span></div>
<div class="canvas"><img id="photo" hidden alt="Vista aérea de uma clareira na floresta"><div id="boxes"></div></div>
<p class="caption" id="caption"></p>
</section>
<aside class="card" aria-labelledby="detail-title">
<div class="head"><h2 id="detail-title">Veículo 1</h2></div>
<div class="detail" aria-live="polite">
<div id="result">
<canvas class="crop" id="crop" width="560" height="264" role="img" aria-label="Recorte do veículo selecionado"></canvas>
<div class="result"><h3 id="model"></h3><span class="tag" id="tag"></span></div>
<div class="metrics"><div class="metric">Confiança da detecção<strong id="confidence"></strong></div><div class="metric">Similaridade visual<strong id="similarity"></strong></div></div>
<h4 class="rank-title">Modelos mais semelhantes</h4><ol class="rank" id="rank"></ol><p class="rank-note" id="rank-note"></p>
</div>
<p class="empty" id="empty" hidden>Imagem carregada para prévia local. Carregue uma imagem para ver as detecções simuladas.</p>
</div>
</aside>
</div>
</main>

<script>
const el = id => document.getElementById(id)
const photo = el('photo')
let record = null
let currentUrl = null
const number = value => Number(value).toLocaleString('pt-BR',{maximumFractionDigits:2})
const label = value => value.replaceAll('_',' ').toUpperCase()
function selectVehicle(index) {
  const vehicle = record.detections[index]
  el('boxes').querySelectorAll('button').forEach((button,i) => button.setAttribute('aria-pressed',String(i===index)))
  el('detail-title').textContent = 'Veículo '+(index+1)
  el('result').hidden = false
  el('empty').hidden = true
  el('model').textContent = vehicle.accepted ? label(vehicle.label) : 'Modelo desconhecido'
  el('tag').textContent = vehicle.accepted ? 'Reconhecido' : 'Abaixo do limiar'
  el('tag').classList.toggle('warn',!vehicle.accepted)
  el('confidence').textContent = number(vehicle.detection_confidence*100)+'%'
  el('similarity').textContent = number(vehicle.similarity)
  el('rank').replaceChildren(...vehicle.top_candidates.map((candidate,i) => {
    const row = document.createElement('li')
    const position = document.createElement('span')
    const name = document.createElement('span')
    const score = document.createElement('b')
    position.textContent = (i+1)+'.'
    name.textContent = label(candidate.label)
    score.textContent = number(candidate.similarity)
    row.append(position,name,score)
    return row
  }))
  el('rank-note').textContent = 'Ranking por similaridade visual.'
  const [x1,y1,x2,y2] = vehicle.bbox
  const canvas = el('crop')
  const ctx = canvas.getContext('2d')
  const width = x2-x1, height = y2-y1
  const scale = Math.min(canvas.width/width,canvas.height/height)
  ctx.clearRect(0,0,canvas.width,canvas.height)
  ctx.drawImage(photo,x1,y1,width,height,(canvas.width-width*scale)/2,(canvas.height-height*scale)/2,width*scale,height*scale)
}
async function analyze(file) {
  if (!file || el('upload').disabled) return
  el('upload').disabled = true
  el('error').hidden = true
  el('boxes').replaceChildren()
  el('result').hidden = true
  el('empty').hidden = false
  el('empty').textContent = 'Processando imagem…'
  el('detail-title').textContent = 'Resultados'
  el('caption').textContent = ''
  el('count').textContent = ''
  photo.hidden = true
  record = null
  try {
    if (file.size > 20*1024*1024) throw new Error('Envie uma imagem de até 20 MB.')
    if (currentUrl) URL.revokeObjectURL(currentUrl)
    currentUrl = URL.createObjectURL(file)
    photo.src = currentUrl
    try { await photo.decode() } catch { throw new Error('Arquivo de imagem inválido.') }
    photo.hidden = false
    el('caption').textContent = file.name
    const response = await fetch('/api/predict',{method:'POST',headers:{'Content-Type':file.type || 'application/octet-stream'},body:file})
    const data = await response.json()
    if (!response.ok) throw new Error(data.error || 'Falha na análise.')
    record = data.images[0]
    el('count').textContent = record.detections.length+' veículos · limiar '+number(data.acceptance_threshold)
    el('boxes').replaceChildren(...record.detections.map((vehicle,i) => {
      const button = document.createElement('button')
      button.className = vehicle.accepted ? 'box' : 'box unknown'
      const [x1,y1,x2,y2] = vehicle.bbox
      Object.assign(button.style,{left:x1/record.width*100+'%',top:y1/record.height*100+'%',width:(x2-x1)/record.width*100+'%',height:(y2-y1)/record.height*100+'%'})
      const title = document.createElement('span')
      title.textContent = 'Veículo '+(i+1)
      button.append(title)
      button.onclick = () => selectVehicle(i)
      return button
    }))
    if (record.detections.length) selectVehicle(0)
    else el('empty').textContent = 'Nenhum veículo detectado nesta imagem.'
  } catch(error) {
    el('error').textContent = error.message
    el('error').hidden = false
    el('empty').textContent = 'A análise não foi concluída. Tente novamente.'
  } finally { el('upload').disabled = false }
}
el('result').hidden = true
el('empty').hidden = false
el('empty').textContent = 'Carregue uma imagem para começar.'
el('detail-title').textContent = 'Resultados'
el('upload').onclick = () => el('file').click()
el('file').onchange = event => { analyze(event.target.files[0]); event.target.value = '' }
for (const target of [el('upload'),el('image-card')]) {
  target.ondragover = event => event.preventDefault()
  target.ondrop = event => {event.preventDefault();analyze(event.dataTransfer.files[0])}
}
</script>
</body></html>
